<mat-card
  class="flash-card"
  [class.large]="size === 'large'"
  [class.anim-exit-toss-left]="
    animationState === 'exit' && exitDirection === 'toss-left'
  "
  [class.anim-exit-toss-right]="
    animationState === 'exit' && exitDirection === 'toss-right'
  "
  [class.anim-exit-toss-up]="
    animationState === 'exit' && exitDirection === 'toss-up'
  "
  [class.anim-enter]="animationState === 'enter'"
  appearance="outlined"
  (animationend)="onAnimationEnd($event)"
>
  <mat-card-content class="card-content">
    @if (hideWord) {
    <span class="word-hidden">?</span>
    } @else {
    <h1 class="word">{{ word?.word }}</h1>
    }
  </mat-card-content>
</mat-card>
